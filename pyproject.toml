[project]
name = "transversal-star-compilation"
version = "0.1.0"
description = "Compilation and architectural simulation of magic-state injection (STAR and T-cultivation) on neutral-atom quantum computers."
authors = [
    { name = "Wan-Hsuan Lin", email = "wanhsuanlin@g.ucla.edu" }
]
readme = "README.md"
# The codebase uses PEP 604 unions (``int | None``) in runtime signatures.
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    # OpenQASM parsing (src/circuit/qasm_loader.py) and gridsynth Rz decomposition
    # (src/t_cultivation/util.py). ``qiskit.synthesis.gridsynth_rz`` needs Qiskit 2.x;
    # the committed T-cultivation data was produced with 2.5.
    "qiskit>=2.5",
    "scipy>=1.10.1",
]

[tool.setuptools]
packages = ["src"]

# Installed by ``uv sync`` alongside the runtime dependencies.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=24.0",
]
